<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <audio id="birthday-music" loop>
            <source src="happy birthday.mp3" type="audio/mpeg">
        </audio>
        <title>Birthday Card</title>
    </head>
    <body>
        <div id="header">
            <h1>Today is Ging's birthday 🎉</h1>
            <img id="bff-img" src="images/Ging.jpg" alt="Ging's photo">
            <!-- <h2 id="bday-age">24 years old</h2>
            <h4 id="bday-date">01.11.2022</h4> -->
        </div>
        <button id="audio-control-btn" onclick="togglePlay()">🎵 Play Background Music</button>
        <div class="gift-section">
            <h2 class="gift-title">Here's how happy we are for you today 🥳</h2>
            <h3 class="gift-hint">(Hover over the gift)</h3>
            <div class="gift-img" id="gift-img-happy"></div>
        </div>
        
        <div class="gift-section">
            <h2 class="gift-title">How we react whenever you join our small group  😍</h2>
            <div class="gift-img" id="gift-img-hot"></div>
        </div>
                
        <div class="gift-section">
            <h2 class="gift-title">If I had to describe you as a person 👇</h2>
            <div class="gift-img" id="gift-img-genius"></div>
        </div>
        
        <!-- <div class="gift-section">
            <h2 class="gift-title">The only person as badass as you 💪</h2>
            <div class="gift-img" id="gift-img-badass"></div> -->
        </div>
        
         <div class="gift-section">
            <h2 class="gift-title">This one's for you, my friend 🥂</h2>
            <div class="gift-img" id="gift-img-cheers"></div>
        </div>
        <script>
function togglePlay() {
  const audio = document.getElementById("birthday-music");
  const btn = document.getElementById("audio-control-btn");

  if (audio.paused) {
    audio.play();
    btn.innerHTML = "⏸️ Pause Music";
    btn.classList.add("playing"); // Applies the green background style
  } else {
    audio.pause();
    btn.innerHTML = "🎵 Play Background Music";
    btn.classList.remove("playing");
  }
}
</script>
    </body>
</html>
